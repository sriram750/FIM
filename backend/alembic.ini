# Alembic configuration for FIM Enterprise

[alembic]
script_location = backend/migrations
prepend_sys_path = backend
version_path_separator = os

# We load URL dynamically from app.core.config.settings in env.py
sqlalchemy.url = postgresql+psycopg2://fim_admin:change_this_postgres_secure_password@localhost:5432/fim_enterprise

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
